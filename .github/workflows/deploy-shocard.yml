name: Deploy 쇼카드 인쇄웹

on:
  push:
    branches: [main]
    paths:
      - '쇼카드-인쇄웹/**'
      - '.github/workflows/deploy-shocard.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./쇼카드-인쇄웹
          destination_dir: shocard
