<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>📦 국립공원 굿즈 바코드북</title>
<meta name="description" content="국립공원 굿즈 상품의 바코드·상품코드·판매가를 검색하는 사내 조회 웹" />
<meta name="theme-color" content="#0f1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<!-- ===== 헤더 ===== -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-logo">
      <span class="logo-icon">📦</span>
      <div class="logo-text">
        <h1 class="logo-title">국립공원 굿즈 바코드북</h1>
        <p class="logo-sub" id="dataInfo">불러오는 중…</p>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn btn-outline" href="https://npp-ubt.com/shocard/" target="_blank" rel="noopener" title="쇼카드 가격표 인쇄 열기" style="text-decoration:none">🏷️ 쇼카드</a>
      <button class="btn btn-outline" id="printBtn" title="현재 검색 결과를 A4로 인쇄">🖨️ 인쇄</button>
    </div>
  </div>

  <!-- 검색 -->
  <div class="search-bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="q" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="상품명 · 바코드 · 상품코드 검색  (초성 검색 가능: ㅂㄷㅇ)" />
      <button class="search-clear" id="clearBtn" hidden aria-label="검색어 지우기">✕</button>
    </div>
  </div>

  <!-- 필터 -->
  <div class="filter-bar">
    <div class="chips" id="groupChips"></div>
    <div class="filter-right">
      <label class="toggle">
        <input type="checkbox" id="showDiscontinued" />
        <span>단종 포함</span>
      </label>
      <select id="sort" class="select" aria-label="정렬">
        <option value="name">가나다순</option>
        <option value="no">등록순</option>
        <option value="priceAsc">가격 낮은순</option>
        <option value="priceDesc">가격 높은순</option>
      </select>
    </div>
  </div>
</header>

<!-- ===== 본문 ===== -->
<main class="app-main">
  <p class="result-count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p class="empty-icon">🔎</p>
    <p class="empty-title">검색 결과가 없습니다</p>
    <p class="empty-sub">상품명 일부나 바코드 뒷자리로 다시 검색해 보세요.</p>
  </div>
</main>

<footer class="app-footer">
  <span id="footerInfo"></span>
  <a href="update.html" class="footer-link">데이터 갱신(관리자)</a>
</footer>

<!-- ===== 상세 ===== -->
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName">
    <button class="sheet-close" id="sheetClose" aria-label="닫기">✕</button>
    <p class="d-group" id="dGroup"></p>
    <h2 class="d-name" id="dName"></h2>
    <p class="d-price" id="dPrice"></p>
    <div class="d-barcode" id="dBarcode"></div>
    <p class="scan-hint" id="scanHint">화면 밝기를 최대로 올리면 잘 찍힙니다</p>
    <button class="btn btn-scan" id="scanBtn">🔍 크게 보기 (계산대 스캔용)</button>
    <div class="d-rows">
      <div class="d-row">
        <span class="d-label">바코드</span>
        <span class="d-value" id="dBc"></span>
        <button class="copy-btn" data-copy="bc">복사</button>
      </div>
      <div class="d-row">
        <span class="d-label">상품코드</span>
        <span class="d-value" id="dCode"></span>
        <button class="copy-btn" data-copy="code">복사</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="config.js?v=4"></script>
<script src="data.js?v=3"></script>
<script>
// Supabase에서 최신 상품을 불러온 뒤 앱을 시작한다. 실패하면 data.js(스냅샷)로 동작.
(async () => {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/products?select=n,code,name,grp,bc,fmt,price,dis&order=n.asc', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    if (r.ok) {
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length) {
        window.BARCODE_DATA = { items: rows, updated: '실시간', source: 'Supabase' };
      }
    }
  } catch (e) { /* 네트워크 차단 등 → data.js 유지 */ }
  const s = document.createElement('script');
  s.src = 'app.js?v=4';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
