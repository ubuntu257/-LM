<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPP 재고 관리 시스템</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- ═══════════════════ LOGIN ═══════════════════ -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>NPP 재고관리</h1>
        <p>국립공원공단 통합몰 물류 관리 시스템</p>
      </div>
    </div>

    <div class="alert alert-danger" id="loginError" style="display:none"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">업체 코드</label>
        <input class="form-input" id="loginCode" type="text" placeholder="업체 코드를 입력하세요" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        <i data-lucide="log-in" style="width:18px;height:18px"></i>
        로그인
      </button>
    </form>
  </div>
</div>

<!-- ═══════════════════ APP ═══════════════════ -->
<div id="appWrap" class="app-wrap" style="display:none">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <div class="sidebar-brand">
        <span class="brand-name">NPP 재고관리</span>
        <span class="brand-sub">INVENTORY SYSTEM</span>
      </div>
      <button class="sidebar-close" id="sidebarClose" onclick="App.closeSidebar()">
        <i data-lucide="x" style="width:18px;height:18px"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">메뉴</div>
      <a class="nav-item" data-page="dashboard" onclick="App.go('dashboard')">
        <i data-lucide="layout-dashboard"></i><span>대시보드</span>
      </a>
      <a class="nav-item" data-page="inventory" onclick="App.go('inventory')">
        <i data-lucide="package"></i><span>재고 현황</span>
        <span class="nav-badge" id="navBadgeLow" style="display:none">!</span>
      </a>
      <a class="nav-item" data-page="transactions" onclick="App.go('transactions')">
        <i data-lucide="arrow-left-right"></i><span>입출고 이력</span>
      </a>
      <a class="nav-item" data-page="requests" onclick="App.go('requests')">
        <i data-lucide="send"></i><span>출고 요청서</span>
        <span class="nav-badge nav-badge-pending" id="navBadgePending" style="display:none">0</span>
      </a>
      <a class="nav-item" data-page="settlement" onclick="App.go('settlement')">
        <i data-lucide="file-spreadsheet"></i><span>정산 관리</span>
      </a>

      <div class="nav-section-label" style="margin-top:8px">시스템</div>
      <a class="nav-item admin-only" data-page="settings" onclick="App.go('settings')" style="display:none">
        <i data-lucide="settings-2"></i><span>설정 / 업체관리</span>
      </a>
      <a class="nav-item" onclick="Auth.logout()">
        <i data-lucide="log-out"></i><span>로그아웃</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebar()"></div>

  <!-- Main -->
  <main class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" id="menuToggle" onclick="App.openSidebar()">
          <i data-lucide="menu" style="width:22px;height:22px"></i>
        </button>
        <div>
          <h2 id="pageTitle" class="page-title-text">대시보드</h2>
          <p id="pageDesc" class="page-desc-text"></p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="role-badge" id="roleBadge"></span>
      </div>
    </header>

    <div class="page-body">
      <div id="pg-dashboard"    class="page active"></div>
      <div id="pg-inventory"    class="page"></div>
      <div id="pg-transactions" class="page"></div>
      <div id="pg-requests"     class="page"></div>
      <div id="pg-settlement"   class="page"></div>
      <div id="pg-settings"     class="page"></div>
    </div>
  </main>
</div>

<!-- Print area -->
<div id="printArea" style="display:none"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/inventory.js"></script>
<script src="js/transactions.js"></script>
<script src="js/requests.js"></script>
<script src="js/settlement.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
