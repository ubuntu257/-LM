<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>관리자 계정 생성</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0f1117; color: #e2e8f0; }
  .box { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 32px; width: 400px; }
  h2 { margin: 0 0 24px; color: #fff; }
  label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #94a3b8; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #2d3148; border-radius: 8px; background: #0f1117; color: #e2e8f0; font-size: 0.95rem; box-sizing: border-box; margin-bottom: 16px; }
  button { width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #5457e0; }
  #result { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem; display: none; }
  .ok { background: #14532d; border: 1px solid #16a34a; color: #86efac; }
  .err { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
  code { display: block; margin-top: 8px; padding: 8px; background: #0f1117; border-radius: 4px; font-family: monospace; font-size: 0.8rem; word-break: break-all; }
</style>
</head>
<body>
<div class="box">
  <h2>🔐 관리자 계정 생성</h2>
  <p style="color:#64748b;font-size:0.85rem;margin-bottom:24px">이 페이지는 최초 관리자 계정 생성 후 삭제하세요.</p>

  <label>업체코드 (예: ADMIN)</label>
  <input id="code" value="ADMIN" placeholder="업체코드">

  <label>비밀번호</label>
  <input id="pw" type="password" placeholder="비밀번호 (6자 이상)">

  <button onclick="createAdmin()">관리자 계정 생성</button>

  <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yuqucgvmptrwcyznorxy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1cXVjZ3ZtcHRyd2N5em5vcnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTYzNDYsImV4cCI6MjA5Mzk5MjM0Nn0.FSSP5bkWS9mMnBTVgrIuCUNGFBbx4ul4qhcZ9aeowtU';
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function createAdmin() {
  const code = document.getElementById('code').value.trim();
  const pw = document.getElementById('pw').value;
  const res = document.getElementById('result');

  if (!code || !pw || pw.length < 6) {
    show('업체코드와 비밀번호(6자 이상)를 입력하세요.', false);
    return;
  }

  const email = code.toLowerCase() + '@npp.internal';

  try {
    const { data, error } = await _sb.auth.signUp({ email, password: pw });
    if (error) throw error;

    const uid = data.user?.id;
    if (!uid) throw new Error('UID를 받지 못했습니다');

    // user_profiles에 관리자로 등록
    const { error: err2 } = await _sb.from('user_profiles').insert({
      id: uid,
      company_code: code.toUpperCase(),
      company_name: '관리자',
      role: 'admin',
      logo_color: '#6366f1',
    });
    if (err2) throw err2;

    show(`✅ 성공! UID: ${uid}\n이메일: ${email}\n\n이제 이 파일(create-admin.html)을 삭제하고 메인 페이지에서 로그인하세요.`, true);
  } catch (e) {
    show('오류: ' + e.message, false);
  }
}

function show(msg, ok) {
  const el = document.getElementById('result');
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
  el.innerHTML = msg.replace(/\n/g, '<br>');
}
</script>
</body>
</html>
