<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="3PL 실시간 재고 관리 시스템 - 물류 창고 재고를 실시간으로 확인하세요">
  <title>3PL 실시간 재고 관리</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/settlement.css">

  <!-- SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- ══════ LOGIN PAGE ══════ -->
  <div class="login-page" id="loginPage">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <h1 class="text-gradient">3PL 재고 관리</h1>
        <p>실시간 물류 재고 관리 시스템</p>
      </div>

      <div class="login-error" id="loginError">
        <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0"></i>
        <span></span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginCode">업체 코드</label>
          <input class="form-input" id="loginCode" type="text" placeholder="업체 코드를 입력하세요" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">비밀번호</label>
          <input class="form-input" id="loginPassword" type="password" placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">
          <i data-lucide="log-in" style="width:20px;height:20px"></i>
          로그인
        </button>
      </form>

      <div class="login-demo">
        <p style="margin-bottom:8px">데모 계정으로 테스트해보세요</p>
        <p><strong>관리자</strong>: ADMIN / admin</p>
        <p><strong>한국전자</strong>: KE2024 / 1234</p>
        <p><strong>프레시푸드</strong>: FF2024 / 1234</p>
        <p><strong>스타일웨어</strong>: SW2024 / 1234</p>
      </div>
    </div>
  </div>

  <!-- ══════ APP LAYOUT ══════ -->
  <div class="app-layout" id="appLayout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-sm">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="brand">
          <h2 class="text-gradient">3PL 재고</h2>
          <span>INVENTORY SYSTEM</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">메뉴</div>
          <div class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
            <i data-lucide="layout-dashboard"></i>
            <span>대시보드</span>
          </div>
          <div class="nav-item" data-page="inventory" onclick="App.navigate('inventory')">
            <i data-lucide="package"></i>
            <span>재고 관리</span>
            <span class="nav-badge" id="alertBadge" style="display:none">0</span>
          </div>
          <div class="nav-item" data-page="history" onclick="App.navigate('history')">
            <i data-lucide="clock"></i>
            <span>입출고 이력</span>
          </div>
          <div class="nav-item" data-page="requests" onclick="App.navigate('requests')">
            <i data-lucide="send"></i>
            <span>출고 요청 관리</span>
          </div>
          <div class="nav-item" data-page="settlements" onclick="App.navigate('settlements')">
            <i data-lucide="file-spreadsheet"></i>
            <span>정산 관리</span>
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">시스템</div>
          <div class="nav-item" data-page="settings" onclick="App.navigate('settings')">
            <i data-lucide="settings"></i>
            <span>설정</span>
          </div>
          <div class="nav-item" onclick="Auth.logout()">
            <i data-lucide="log-out"></i>
            <span>로그아웃</span>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item" id="themeToggle" onclick="App.toggleTheme()" style="margin-bottom:10px;">
          <i data-lucide="moon" id="themeIcon"></i>
          <span id="themeText">다크 모드</span>
        </div>
        <div class="sidebar-user" id="sidebarUser"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <div class="page-title">
          <button class="btn-icon" onclick="App.toggleSidebar()" style="display:none" id="menuToggle">
            <i data-lucide="menu" style="width:22px;height:22px"></i>
          </button>
          <h2 id="pageTitle">대시보드</h2>
          <p id="pageDesc">실시간 재고 현황을 한눈에 확인하세요</p>
        </div>
        <div class="header-actions">
          <div class="badge badge-info" style="font-size:0.8rem;padding:6px 14px">
            📦 3PL 재고관리
          </div>
        </div>
      </header>

      <div class="content-body">
        <div class="page-content" id="page-dashboard"></div>
        <div class="page-content" id="page-inventory" style="display:none"></div>
        <div class="page-content" id="page-history" style="display:none"></div>
        <div class="page-content" id="page-requests" style="display:none"></div>
        <div class="page-content" id="page-settlements" style="display:none"></div>
        <div class="page-content" id="page-settings" style="display:none"></div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="js/sample-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/history.js"></script>
  <script src="js/requests.js?v=4"></script>
  <script src="js/settlement.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      const mq = window.matchMedia('(max-width:1024px)');
      const toggle = document.getElementById('menuToggle');
      const handleMQ = (e) => { if (toggle) toggle.style.display = e.matches ? 'block' : 'none'; };
      mq.addEventListener('change', handleMQ);
      handleMQ(mq);
    });
  </script>

  <!-- ══════ PRINT AREA ══════ -->
  <div id="printArea" style="display:none;"></div>
</body>
</html>
